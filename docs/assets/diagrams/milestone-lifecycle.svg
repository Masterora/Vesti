<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Milestone lifecycle / 里程碑生命周期</title>
  <desc id="desc">Milestones progress from pending to released, with revision and dispute branches.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 24px Inter,"Noto Sans SC",Arial,sans-serif;fill:#f8fafc}.state{fill:#111827;stroke:#64748b;stroke-width:2}.active{fill:#0c2841;stroke:#38bdf8}.done{fill:#0d2a24;stroke:#34d399}.warn{fill:#2a1c12;stroke:#fb923c}.label{font:700 16px Inter,"Noto Sans SC",Arial,sans-serif;fill:#f8fafc;text-anchor:middle}.sub{font:13px Inter,"Noto Sans SC",Arial,sans-serif;fill:#cbd5e1;text-anchor:middle}.edge{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}.disputeEdge{fill:none;stroke:#fb923c;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}.edgeLabel{font:12.5px Inter,"Noto Sans SC",Arial,sans-serif;fill:#cbd5e1;text-anchor:middle}.start{fill:#f8fafc}
    </style>
  </defs>
  <rect width="1400" height="720" rx="24" fill="#070d19"/>
  <text class="title" x="40" y="44">Milestone lifecycle / 里程碑生命周期</text>

  <circle class="start" cx="45" cy="180" r="10"/>
  <rect class="state" x="80" y="135" width="170" height="90" rx="15"/><text class="label" x="165" y="173">pending</text><text class="sub" x="165" y="200">等待前置条件</text>
  <rect class="state" x="300" y="135" width="170" height="90" rx="15"/><text class="label" x="385" y="173">ready</text><text class="sub" x="385" y="200">可提交证明</text>
  <rect class="state active" x="530" y="135" width="190" height="90" rx="15"/><text class="label" x="625" y="173">submitted</text><text class="sub" x="625" y="200">证明已提交</text>
  <rect class="state active" x="800" y="135" width="180" height="90" rx="15"/><text class="label" x="890" y="173">approved</text><text class="sub" x="890" y="200">需求方已批准</text>
  <rect class="state done" x="1070" y="135" width="190" height="90" rx="15"/><text class="label" x="1165" y="173">released</text><text class="sub" x="1165" y="200">付款已释放</text>

  <rect class="state warn" x="520" y="360" width="210" height="90" rx="15"/><text class="label" x="625" y="398">revision_requested</text><text class="sub" x="625" y="425">等待工作者修改</text>
  <rect class="state warn" x="800" y="560" width="180" height="90" rx="15"/><text class="label" x="890" y="598">disputed</text><text class="sub" x="890" y="625">争议中</text>

  <path class="edge" d="M55 180 H80"/>
  <path class="edge" d="M250 180 H300"/><text class="edgeLabel" x="275" y="115">Previous done / 前项完成</text>
  <path class="edge" d="M470 180 H530"/><text class="edgeLabel" x="500" y="115">Submit / 提交</text>
  <path class="edge" d="M720 180 H800"/><text class="edgeLabel" x="760" y="115">Approve / 批准</text>
  <path class="edge" d="M980 180 H1070"/><text class="edgeLabel" x="1025" y="115">Release / 付款</text>
  <path class="edge" d="M625 225 V360"/><text class="edgeLabel" x="700" y="295">Revise / 请求修改</text>
  <path class="edge" d="M580 360 C500 330 500 250 580 225"/><text class="edgeLabel" x="490" y="295">Resubmit / 重新提交</text>

  <path class="disputeEdge" d="M385 225 C390 470 690 530 815 570"/>
  <path class="disputeEdge" d="M665 225 C690 430 790 500 850 560"/>
  <path class="disputeEdge" d="M690 450 C740 500 800 535 850 560"/>
  <path class="disputeEdge" d="M890 225 V560"/>
  <text class="edgeLabel" x="1050" y="525">Any unreleased state / 任一未付款状态</text>
  <path class="edge" d="M980 605 C1180 590 1260 430 1195 225"/><text class="edgeLabel" x="1190" y="505">Mutual release / 双方同意释放</text>
</svg>
