name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vesti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vesti"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vesti
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SOLANA_NETWORK: devnet
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_USDC_MINT: ""
      ESCROW_ADAPTER_MODE: mock
      ESCROW_PROGRAM_ID: ErFsmiKY7WxjD9ArYmpqjCCUKnTcfzLm6tFpmWdFU9ck
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      DEMO_WALLET_AUTH_ENABLED: "false"
      NEXT_PUBLIC_DEMO_WALLET_AUTH_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate schema
        run: pnpm prisma validate

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Build production application
        run: pnpm build

  onchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Solana and Anchor
        uses: solana-foundation/github-actions/setup-all@2a02b58f6989d9fa9a568aa03f558156984663de
        with:
          solana_version: 3.1.14
          anchor_version: 1.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path programs/vesti-escrow/Cargo.toml --check

      - name: Run Rust tests
        run: cargo test --manifest-path programs/vesti-escrow/Cargo.toml --locked

      - name: Build Solana program and IDL
        run: anchor build --ignore-keys --provider.cluster localnet

      - name: Test real token transfers on local validator
        run: pnpm test:onchain
